# /etc/default/hsa-snoop — installed by the hsa-snoop Debian package.
# Edit this file to change service behaviour, then:
#   sudo systemctl restart hsa-snoop

# GPU-capable user: SUDO_UID/SUDO_GID allow DetectGpuType() to call
# rocminfo as the primary console user rather than root. This is needed
# on WSL2/DXG where the HSA runtime requires a user-session GPU handle.
# postinst auto-detects these values at install time; override here if
# the auto-detected UID/GID is wrong for your system.
SUDO_UID=1000
SUDO_GID=1000

# Command-line flags passed to hsa-snoop.
# --all          : monitor all GPU processes system-wide (daemon mode)
# --prometheus   : expose Prometheus /metrics endpoint (port 9488)
# --ais-snoop    : enable AMD Infinity Storage P2P IO monitoring
# --mem-snoop    : enable kernarg buffer scan for VRAM footprint metrics
# --xnack-snoop  : enable GPU page-fault retry (XNACK) event counting
#
# Examples:
#   HSA_SNOOP_ARGS="--all --prometheus --poll-us 50"
#   HSA_SNOOP_ARGS="--all --prometheus --ais-snoop --prometheus-port 9489"
HSA_SNOOP_ARGS="--all --prometheus --ais-snoop --mem-snoop --xnack-snoop"
