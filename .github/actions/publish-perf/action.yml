name: Publish hsa-snoop performance trends
description: >-
  Append a Prometheus metrics snapshot to the gh-pages perf history,
  refresh shields badges, regenerate the trend HTML, and push to gh-pages.

# Only runs after a successful vm-hardware-test job on the default branch.
# Nothing here may fail the calling job — by then the lane has already
# measured everything.  A trend that cannot be committed is worth a warning.

inputs:
  prometheus-file:
    description: Path to the Prometheus exposition text collected by the test.
    required: true
  token:
    description: >-
      Token with contents: write (to push gh-pages) and
      actions: write (to dispatch docs-deploy if one exists).
    required: true
  runner-class:
    description: Class of runner the numbers came from (github-hosted, self-hosted, …).
    required: false
    default: github-hosted

runs:
  using: composite
  steps:
    - name: Record the trends and refresh the shields
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PROMETHEUS_FILE: ${{ inputs.prometheus-file }}
        RUNNER_CLASS: ${{ inputs.runner-class }}
      run: |
        set -euo pipefail

        if [ ! -f "$PROMETHEUS_FILE" ]; then
          echo "::warning::prometheus file not found: $PROMETHEUS_FILE; nothing to publish"
          exit 0
        fi

        python3 ci/report/publish-perf.py \
          --prometheus-file "$PROMETHEUS_FILE" \
          --docs-dir docs \
          --runner "$RUNNER_CLASS"

        bail() { echo "::warning::$1; trends not published"; exit 0; }

        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        git config --global --add safe.directory '*' || true
        git config --global user.name  "hsa-snoop-ci" || bail "could not configure git"
        git config --global user.email "hsa-snoop-ci@users.noreply.github.com" || bail "could not configure git"
        git config --global commit.gpgSign false || bail "could not configure git"

        pages="$(mktemp -d)"
        git clone --quiet --depth 1 --branch gh-pages "$remote" "$pages" \
          || bail "could not clone gh-pages (has it been seeded?)"

        # Seed the working copy from the published data so each run appends
        # to the real record, not to the empty placeholder committed to main.
        mkdir -p docs/perf-history
        cp "$pages/perf/history.jsonl" docs/perf-history/history.jsonl 2>/dev/null || true
        cp "$pages"/perf/badge-*.json  docs/perf-history/ 2>/dev/null || true

        # Re-run with the seeded history so the HTML reflects all prior runs
        python3 ci/report/publish-perf.py \
          --prometheus-file "$PROMETHEUS_FILE" \
          --docs-dir docs \
          --runner "$RUNNER_CLASS"

        pushed=""
        for attempt in 1 2 3; do
          mkdir -p "$pages/perf"
          cp docs/perf-history/history.jsonl "$pages/perf/" || bail "could not stage history"
          cp docs/perf-history/badge-*.json  "$pages/perf/" 2>/dev/null || true
          cp docs/perf-history/index.html    "$pages/perf/" || bail "could not stage index"

          git -C "$pages" add perf || bail "could not stage perf/"
          if git -C "$pages" diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git -C "$pages" commit \
            -m "perf: publish trends from run ${GITHUB_RUN_ID}" \
            -m "Generated by ci/report/publish-perf.py. [skip ci]" \
            || bail "could not commit the trends"

          if git -C "$pages" push origin HEAD:gh-pages; then
            pushed=yes
            break
          fi
          echo "push rejected (attempt ${attempt}); refreshing and retrying"
          sleep $((attempt * 5))
          git -C "$pages" reset --hard HEAD~1 || bail "could not unwind rejected commit"
          git -C "$pages" fetch --quiet --depth 1 origin gh-pages \
            || bail "could not refresh gh-pages"
          git -C "$pages" reset --hard FETCH_HEAD || bail "could not refresh gh-pages"
          cp "$pages/perf/history.jsonl" docs/perf-history/history.jsonl 2>/dev/null || true
          cp "$pages"/perf/badge-*.json  docs/perf-history/ 2>/dev/null || true
          python3 ci/report/publish-perf.py \
            --prometheus-file "$PROMETHEUS_FILE" \
            --docs-dir docs \
            --runner "$RUNNER_CLASS"
        done
        [ -n "$pushed" ] || bail "could not push after 3 attempts"
        echo "published"
