name: Publish hsa-snoop performance trends and Prometheus snapshot
description: >-
  Append a Prometheus metrics snapshot to the gh-pages perf history,
  refresh the shields badges, write a JSON snapshot of every metric,
  optionally append the per-kernel timing summary, and push them to
  gh-pages for the MkDocs site to present.

# Only runs after a successful vm-hardware-test job on the default branch.
# Nothing here may fail the calling job — by then the lane has already
# measured everything.  A trend that cannot be committed is worth a warning.

inputs:
  prometheus-file:
    description: Path to the Prometheus exposition text collected by the test.
    required: true
  dispatch-log:
    description: >-
      Path to the NDJSON dispatch log from the kernel-timing capture.
      Optional; when absent or missing only the Prometheus data is published.
    required: false
    default: ''
  token:
    description: >-
      Token with contents: write (to push gh-pages).
    required: true
  runner-class:
    description: Class of runner the numbers came from (github-hosted, self-hosted, …).
    required: false
    default: github-hosted

runs:
  using: composite
  steps:
    - name: Record the trends and refresh the shields
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PROMETHEUS_FILE: ${{ inputs.prometheus-file }}
        DISPATCH_LOG: ${{ inputs.dispatch-log }}
        RUNNER_CLASS: ${{ inputs.runner-class }}
      run: |
        set -euo pipefail

        if [ ! -f "$PROMETHEUS_FILE" ]; then
          echo "::warning::prometheus file not found: $PROMETHEUS_FILE; nothing to publish"
          exit 0
        fi

        bail() { echo "::warning::$1; trends not published"; exit 0; }

        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        git config --global --add safe.directory '*' || true
        git config --global user.name  "hsa-snoop-ci" || bail "could not configure git"
        git config --global user.email "hsa-snoop-ci@users.noreply.github.com" || bail "could not configure git"
        git config --global commit.gpgSign false || bail "could not configure git"

        pages="$(mktemp -d)"
        git clone --quiet --depth 1 --branch gh-pages "$remote" "$pages" \
          || bail "could not clone gh-pages (has it been seeded?)"

        # Data only: the pages that present these files are part of the
        # MkDocs site and fetch them at runtime, so nothing here is HTML
        # and docs-deploy leaves all of it in place.
        record() {
          python3 hsa-snoop/.github/ci/report/publish-perf.py \
            --prometheus-file "$PROMETHEUS_FILE" \
            --out-dir "$pages/perf" \
            --snapshot-output "$pages/prom/snapshot.json" \
            --runner "$RUNNER_CLASS"
          if [ -n "$DISPATCH_LOG" ] && [ -s "$DISPATCH_LOG" ]; then
            python3 hsa-snoop/.github/ci/report/publish-kernel-timing.py \
              --dispatch-log "$DISPATCH_LOG" \
              --out-dir "$pages/timing" \
              --runner "$RUNNER_CLASS"
          fi
        }

        pushed=""
        for attempt in 1 2 3; do
          record || bail "could not record the run"
          git -C "$pages" add perf/history.jsonl perf/badge-*.json prom/snapshot.json \
            || bail "could not stage perf/ prom/"
          if [ -d "$pages/timing" ]; then
            git -C "$pages" add timing/history.jsonl timing/badge-*.json \
              || bail "could not stage timing/"
          fi
          git -C "$pages" commit \
            -m "perf: publish trends and snapshot from run ${GITHUB_RUN_ID}" \
            -m "Generated by .github/ci/report/publish-perf.py. [skip ci]" \
            || bail "could not commit the trends"

          if git -C "$pages" push origin HEAD:gh-pages; then
            pushed=yes
            break
          fi
          echo "push rejected (attempt ${attempt}); refreshing and retrying"
          sleep $((attempt * 5))
          git -C "$pages" fetch --quiet --depth 1 origin gh-pages \
            || bail "could not refresh gh-pages"
          git -C "$pages" reset --hard FETCH_HEAD || bail "could not refresh gh-pages"
        done
        [ -n "$pushed" ] || bail "could not push after 3 attempts"
        echo "published"
