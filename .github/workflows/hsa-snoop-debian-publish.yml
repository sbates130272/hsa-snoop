name: debian-publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

# Merging a release PR and pushing its tag starts two runs on the same commit,
# and both see the tag at HEAD. Run them one after the other; the second then
# finds the release already there. Keyed on the commit so that a run is only
# ever queued behind, or replaced by, another run for the same commit.
concurrency:
  group: debian-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-deb:
    name: Publish Debian package to GitHub Releases
    runs-on: ubuntu-latest
    container:
      image: rocm/dev-ubuntu-24.04:10.1.0-full
      options: --user root
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Install git and gh
      run: |
        apt-get update
        apt-get install -y git gh

    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # The image may install ROCm under /opt/rocm or a versioned
    # /opt/rocm/core-<ver>; find it once and export it for CMake and the
    # loader instead of hard-coding either.
    - name: Locate ROCm
      run: |
        rocm_path=$(ls -d /opt/rocm/core-* 2>/dev/null | sort -V | tail -1)
        rocm_path=${rocm_path:-/opt/rocm}
        test -f "$rocm_path/include/hsa/hsa_api_trace.h"
        echo "ROCm at $rocm_path"
        {
          echo "ROCM_PATH=$rocm_path"
          echo "CMAKE_PREFIX_PATH=$rocm_path"
          echo "LD_LIBRARY_PATH=$rocm_path/lib:/usr/lib/x86_64-linux-gnu"
        } >> "$GITHUB_ENV"
        echo "$rocm_path/bin" >> "$GITHUB_PATH"

    - name: Mark repo as safe for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install build dependencies
      run: apt-get install -y cmake dpkg-dev

    - name: Determine version
      id: version
      shell: bash
      run: |
        # Use the git tag if this run was triggered by one, otherwise fall back
        # to the short commit SHA prefixed with 0~ (pre-release ordering).
        TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
        if [[ -n "$TAG" ]]; then
          VERSION="${TAG#v}"        # strip leading 'v'
          PRERELEASE=false
        else
          VERSION="0~${GITHUB_SHA::8}"
          PRERELEASE=true
        fi
        echo "VERSION=${VERSION}"    >> "$GITHUB_ENV"
        echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"
        echo "TAG=${TAG}"            >> "$GITHUB_ENV"

    - name: Configure with CMake (Prometheus enabled)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DGPU_TARGETS=gfx942 \
          -DHSA_SNOOP_PROMETHEUS=ON

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Install into staging tree
      run:       DESTDIR=/tmp/pkg cmake --install build

    - name: Assemble .deb
      shell: bash
      run: |
        mkdir -p /tmp/pkg/DEBIAN
        cp debian/control debian/postinst debian/prerm debian/conffiles /tmp/pkg/DEBIAN/
        chmod 0755 /tmp/pkg/DEBIAN/postinst /tmp/pkg/DEBIAN/prerm
        sed -i "s/^Version:.*/Version: ${VERSION}/" /tmp/pkg/DEBIAN/control
        DEB_FILE="hsa-snoop_${VERSION}_amd64.deb"
        dpkg-deb --build --root-owner-group /tmp/pkg "${DEB_FILE}"
        echo "DEB_FILE=${DEB_FILE}" >> "$GITHUB_ENV"

    - name: Verify .deb metadata
      run: dpkg-deb --info "$DEB_FILE"

    - name: Publish to GitHub Releases
      shell: bash
      run: |
        if [[ "${PRERELEASE}" == "false" ]]; then
          # Named semver release. The push to main and the push of the tag
          # both get here for the same commit, so the release may already
          # exist: then only replace the package, built from the same source.
          upload_deb() {
            gh release upload "${TAG}" "${DEB_FILE}" --clobber
          }
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists; replacing ${DEB_FILE}"
            upload_deb
          elif ! gh release create "${TAG}" \
                 --title "hsa-snoop ${TAG}" \
                 --generate-notes \
                 "${DEB_FILE}"; then
            # Lost a race with another run that created it meanwhile.
            gh release view "${TAG}" > /dev/null
            upload_deb
          fi
        else
          # Rolling latest pre-release for every main push
          gh release delete latest --yes || true
          gh release create latest \
            --title "Latest build (${VERSION})" \
            --notes "Automatically published from main at commit ${GITHUB_SHA}." \
            --prerelease \
            "${DEB_FILE}"
        fi
