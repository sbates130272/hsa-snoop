name: build-check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hip'
      - 'CMakeLists.txt'
      - 'deploy/examples/**'
      - 'src/**'
      - 'deploy/systemd/**'
      - '.github/workflows/hsa-snoop-build-check.yml'

permissions:
  contents: read

jobs:
  build-check:
    name: build-check for hsa-snoop (ROCm ${{ matrix.rocm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rocm: ['7.14.0', '10.1.0', '10.2.0']
    container:
      image: rocm/dev-ubuntu-24.04:${{ matrix.rocm }}-full
      options: --user root
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # The image may install ROCm under /opt/rocm or a versioned
    # /opt/rocm/core-<ver>; find it once and export it for CMake and the
    # loader instead of hard-coding either.
    - name: Locate ROCm
      run: |
        rocm_path=$(ls -d /opt/rocm/core-* 2>/dev/null | sort -V | tail -1)
        rocm_path=${rocm_path:-/opt/rocm}
        test -f "$rocm_path/include/hsa/hsa_api_trace.h"
        echo "ROCm at $rocm_path"
        {
          echo "ROCM_PATH=$rocm_path"
          echo "CMAKE_PREFIX_PATH=$rocm_path"
          echo "LD_LIBRARY_PATH=$rocm_path/lib:/usr/lib/x86_64-linux-gnu"
        } >> "$GITHUB_ENV"
        echo "$rocm_path/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y cmake

    - name: Configure with CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DGPU_TARGETS=gfx942

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Install
      run: cmake --install build --prefix /tmp/hsa-snoop-install

    - name: Verify install
      run: |
        test -x /tmp/hsa-snoop-install/bin/hsa-snoop
        test ! -e /tmp/hsa-snoop-install/lib/systemd/system/hsa-snoop-prometheus.service
        test ! -e /tmp/hsa-snoop-install/share/hsa-snoop/hsa-snoop.conf
        /tmp/hsa-snoop-install/bin/hsa-snoop --help

  build-check-prometheus:
    name: build-check for hsa-snoop (Prometheus exporter, ROCm ${{ matrix.rocm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rocm: ['7.14.0', '10.1.0', '10.2.0']
    container:
      image: rocm/dev-ubuntu-24.04:${{ matrix.rocm }}-full
      options: --user root
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # The image may install ROCm under /opt/rocm or a versioned
    # /opt/rocm/core-<ver>; find it once and export it for CMake and the
    # loader instead of hard-coding either.
    - name: Locate ROCm
      run: |
        rocm_path=$(ls -d /opt/rocm/core-* 2>/dev/null | sort -V | tail -1)
        rocm_path=${rocm_path:-/opt/rocm}
        test -f "$rocm_path/include/hsa/hsa_api_trace.h"
        echo "ROCm at $rocm_path"
        {
          echo "ROCM_PATH=$rocm_path"
          echo "CMAKE_PREFIX_PATH=$rocm_path"
          echo "LD_LIBRARY_PATH=$rocm_path/lib:/usr/lib/x86_64-linux-gnu"
        } >> "$GITHUB_ENV"
        echo "$rocm_path/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y cmake git

    - name: Configure with CMake (Prometheus enabled)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DGPU_TARGETS=gfx942 \
          -DHSA_SNOOP_PROMETHEUS=ON

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Install
      run: cmake --install build --prefix /tmp/hsa-snoop-install

    - name: Verify install
      run: |
        test -x /tmp/hsa-snoop-install/bin/hsa-snoop
        test -f /tmp/hsa-snoop-install/lib/systemd/system/hsa-snoop-prometheus.service
        test -f /tmp/hsa-snoop-install/share/hsa-snoop/hsa-snoop.conf
        /tmp/hsa-snoop-install/bin/hsa-snoop --help
        /tmp/hsa-snoop-install/bin/hsa-snoop --prometheus --all 2>&1 | grep -q "Prometheus metrics at"
