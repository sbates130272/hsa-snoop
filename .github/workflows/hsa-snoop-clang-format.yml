name: hsa-snoop - Clang Format

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hip'
      - '.clang-format'
      - '.github/workflows/hsa-snoop-clang-format.yml'

permissions:
  contents: read

jobs:
  clang-format:
    name: Clang Format
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Run clang-format lint
      uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: '.'
        exclude: './build'
        extensions: 'cpp,h,hip'
        clangFormatVersion: 18
        style: file
        inplace: false
