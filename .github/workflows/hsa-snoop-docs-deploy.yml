name: hsa-snoop - docs-deploy

# Builds the MkDocs Material site from docs/ and publishes it to the
# gh-pages branch, served at https://sbates130272.github.io/hsa-snoop/.
#
# A branch deploy rather than the actions/deploy-pages artifact flow,
# because this is not the only writer. vm-hardware-test pushes the
# performance data (perf/history.jsonl, perf/badge-*.json,
# prom/snapshot.json, timing/history.jsonl, timing/badge-*.json) and
# grafana-screenshot pushes images/grafana-dashboard.png. The site
# build knows nothing about those files, so the publish step below
# leaves them in place; the pages that present them fetch them at
# runtime.
#
# Pull requests build the site with --strict but publish nothing.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.mkdocs.yml'
      - '.github/workflows/hsa-snoop-docs-deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.mkdocs.yml'
      - '.github/workflows/hsa-snoop-docs-deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-site:
    name: build and publish GitHub Pages site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python for MkDocs
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt

      - name: Build site with MkDocs
        run: mkdocs build --strict --config-file .mkdocs.yml --site-dir site

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          git config user.name  "hsa-snoop-ci"
          git config user.email "hsa-snoop-ci@users.noreply.github.com"
          git config commit.gpgSign false

          git fetch --quiet origin gh-pages
          git worktree add --quiet --detach ../gh-pages FETCH_HEAD

          for attempt in 1 2 3; do
            # Replace the published tree with the built site. The
            # excludes are the files the other workflows own: rsync
            # neither overwrites nor deletes an excluded path.
            rsync -a --delete \
              --exclude '/.git' \
              --exclude '/perf/history.jsonl' \
              --exclude '/perf/badge-*.json' \
              --exclude '/prom/snapshot.json' \
              --exclude '/timing/history.jsonl' \
              --exclude '/timing/badge-*.json' \
              --exclude '/images/grafana-dashboard.png' \
              site/ ../gh-pages/

            # The theme emits directories GitHub's Jekyll would skip.
            touch ../gh-pages/.nojekyll

            git -C ../gh-pages add -A
            if git -C ../gh-pages diff --cached --quiet; then
              echo "site unchanged"
              exit 0
            fi
            git -C ../gh-pages commit \
              -m "docs: publish site from ${GITHUB_SHA}" \
              -m "Built by hsa-snoop-docs-deploy.yml. [skip ci]"

            if git -C ../gh-pages push origin HEAD:gh-pages; then
              echo "published"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); refreshing and retrying"
            sleep $((attempt * 5))
            git fetch --quiet origin gh-pages
            git -C ../gh-pages reset --hard FETCH_HEAD
          done

          echo "::error::could not push the site after 3 attempts"
          exit 1
