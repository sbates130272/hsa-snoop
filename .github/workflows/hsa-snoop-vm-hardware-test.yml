name: vm-hardware-test

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:17 UTC on main — keeps perf history and snapshot fresh.
    - cron: '17 2 * * *'
  pull_request:
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hip'
      - 'CMakeLists.txt'
      - 'deploy/examples/**'
      - 'src/**'
      - 'tests/**'
      - '.github/ci/report/*kernel-timing*'
      - '.github/ci/vm-fleet.xml'
      - '.github/workflows/hsa-snoop-vm-hardware-test.yml'
  push:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hip'
      - 'CMakeLists.txt'
      - 'deploy/examples/**'
      - 'src/**'
      - 'tests/**'
      - '.github/ci/report/*kernel-timing*'
      - '.github/ci/vm-fleet.xml'
      - '.github/workflows/hsa-snoop-vm-hardware-test.yml'

permissions:
  contents: read

# Publish step needs write access to push to gh-pages.  Only on-push jobs
# (default branch) reach that step; pull_request jobs do not.
# The job overrides this to write only when the event is a push to main.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vm-hardware-test:
    name: hardware tests in rocjitsu VM (gfx1250)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
    - name: Check out hsa-snoop
      uses: actions/checkout@v7
      with:
        path: hsa-snoop

    # One guest, described by .github/ci/vm-fleet.xml: ROCm 10.2, two emulated
    # gfx1250 GPUs and an NVMe namespace. The action boots it, loads amdgpu in
    # it, copies the checkout to ~/hsa-snoop and runs the script there. A post
    # step tears the fleet down.
    #
    # qemu-tool 3 starts every guest with an AMD vCPU whatever the runner's
    # CPU is, which AIS needs: with an Intel-vendor vCPU the guest kernel
    # refuses PCI peer-to-peer DMA through the emulated host bridge.
    - name: Boot the guest and build hsa-snoop in it
      id: fleet
      uses: sbates130272/qemu-tool-action@v2
      with:
        qemu-tool-version: 3.0.0
        xml: hsa-snoop/.github/ci/vm-fleet.xml
        gpu: required
        diagnostics: true
        copy: |
          hsa-snoop:hsa-snoop
        run: |
          ls /dev/kfd
          # The CPU-only node has gpu_id 0.
          gpus=$(cat /sys/class/kfd/kfd/topology/nodes/*/gpu_id | grep -vc '^0$')
          echo "KFD GPUs: $gpus"
          test "$gpus" -eq 2

          # The AIS tests read and write a file on the NVMe namespace.
          sudo mkfs.ext4 -q -F /dev/nvme0n1
          sudo mkdir -p /mnt/nvme
          sudo mount /dev/nvme0n1 /mnt/nvme
          # Pre-allocate the file so ais-test does not need to ftruncate.
          sudo dd if=/dev/zero of=/mnt/nvme/ais-test.bin bs=1M count=64 status=none
          sudo chmod 666 /mnt/nvme/ais-test.bin

          rocm_path=$(ls -d /opt/rocm/core-* 2>/dev/null | sort -V | tail -1)
          rocm_path=${rocm_path:-/opt/rocm}
          export PATH="${rocm_path}/bin:${PATH}"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="${rocm_path}" \
            -DGPU_TARGETS=gfx1250 \
            -DHSA_SNOOP_HARDWARE_TESTS=ON \
            -DHSA_SNOOP_HARDWARE_GPUS=2 \
            -DHSA_SNOOP_PROMETHEUS=ON
          cmake --build build --parallel "$(nproc)"
          ls -lh build/deploy/examples/sdma-test build/deploy/examples/gfx-test build/ais-test
          # The HSA_TOOLS_LIB profiler shim is optional in CMake (it needs the
          # HSA headers), so a missing one would otherwise go unnoticed.
          ls -lh build/libhsa-snoop-profiler.so

    - name: Run unit tests in VM
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" vm1 bash -s <<'EOF'
        set -euo pipefail
        cd ~/hsa-snoop/build
        ctest --label-exclude hardware -V
        EOF

    - name: Run hardware tests in VM
      timeout-minutes: 10
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" vm1 bash -s <<'EOF'
        set -euo pipefail
        cd ~/hsa-snoop/build
        # The emulated GPU reports no clock counter through KFD; its dispatch
        # timestamps are in nanoseconds.
        sudo env HSA_SNOOP_GPU_CLOCK_HZ=1000000000 ctest -L hardware -V
        EOF

    # The AIS tests need ten successful requests: they fail on an AMD guest
    # and skip on any other vendor. The workload exits 0 even when its
    # requests fail, so the guest's CPU vendor and its AIS and peer-to-peer
    # kernel messages say why a run was red or skipped.
    - name: Show guest CPU vendor and AIS kernel messages
      if: always() && steps.fleet.outputs.stack-dir != ''
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" vm1 \
          "grep -m1 vendor_id /proc/cpuinfo; grep -m1 'model name' /proc/cpuinfo; sudo dmesg | grep -iE 'ais|p2p|peer-to-peer|smpboot: CPU0' | tail -n 100" || true

    - name: Collect test results
      if: always() && steps.fleet.outputs.stack-dir != ''
      run: |
        scp -F "$QEMU_TOOL_SSH_CONFIG" -r vm1:hsa-snoop/build/Testing ./test-results || true
        # The traces the hardware tests assert on. The published SDMA and AIS
        # figures are derived from them, so keep them with the results.
        mkdir -p ./test-results/traces
        scp -F "$QEMU_TOOL_SSH_CONFIG" 'vm1:hsa-snoop/build/*-hardware-test.json' \
          ./test-results/traces/ || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: vm-hardware-test-results
        path: test-results/
        retention-days: 7

    - name: Collect Prometheus snapshot for perf history
      if: success()
      run: |
        mkdir -p ./artifacts
        scp -F "$QEMU_TOOL_SSH_CONFIG" vm1:hsa-snoop/build/hsa-snoop-prometheus.txt \
          ./artifacts/prometheus.txt 2>/dev/null || true
        test -s ./artifacts/prometheus.txt || echo "::warning::Prometheus snapshot not collected — prometheus-monotonicity-hardware-test may have been skipped or failed" >&2

    # Kernel timing lane. Runs the gfx-test HIP kernels under hsa-snoop with
    # the dispatch log on and the HSA_TOOLS_LIB profiler shim loaded. The
    # capture fails if the shim is missing, if the HSA runtime does not load
    # it, if no dispatch resolves to a kernel name, or if none carries GPU
    # timestamps. continue-on-error so a
    # failure here
    # cannot cost the run its perf history; the "Fail if" step at the end of
    # the job still turns the run red.
    - name: Capture kernel timing in VM
      id: kernel-timing
      if: success()
      continue-on-error: true
      timeout-minutes: 15
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" vm1 \
          env TIMING_REQUIRE_SHIM=1 \
          bash hsa-snoop/.github/ci/report/capture-kernel-timing.sh \
            hsa-snoop/build hsa-snoop/build/kernel-timing.ndjson
        mkdir -p ./artifacts
        scp -F "$QEMU_TOOL_SSH_CONFIG" vm1:hsa-snoop/build/kernel-timing.ndjson \
          ./artifacts/kernel-timing.ndjson
        python3 hsa-snoop/.github/ci/report/publish-kernel-timing.py \
          --dispatch-log ./artifacts/kernel-timing.ndjson \
          --out-dir ./artifacts/kernel-timing \
          --summary "$GITHUB_STEP_SUMMARY"

    # A second, unpublished capture with hsa-snoop's debug log on. The debug
    # writes slow the poll loop, so this cannot be the published capture; it
    # records the write/read pointers at every poll and how each dispatch was
    # retired, which is what explains a capture with missing queue durations.
    - name: Capture kernel timing debug log in VM
      if: always() && steps.kernel-timing.outcome != 'skipped'
      continue-on-error: true
      timeout-minutes: 15
      run: |
        # Fetch the log whatever the capture returned: a failed capture is
        # the one whose log is wanted.
        rc=0
        ssh -F "$QEMU_TOOL_SSH_CONFIG" vm1 \
          env TIMING_DEBUG=1 \
              TIMING_LOG=hsa-snoop/build/kernel-timing-debug.log \
          bash hsa-snoop/.github/ci/report/capture-kernel-timing.sh \
            hsa-snoop/build hsa-snoop/build/kernel-timing-debug.ndjson \
          || rc=$?
        mkdir -p ./artifacts
        for f in kernel-timing-debug.log kernel-timing-debug.ndjson; do
          scp -F "$QEMU_TOOL_SSH_CONFIG" vm1:hsa-snoop/build/"$f" \
            ./artifacts/ || true
        done
        exit "$rc"

    - name: Upload kernel timing
      if: always() && steps.kernel-timing.outcome != 'skipped'
      uses: actions/upload-artifact@v7
      with:
        name: kernel-timing
        path: |
          artifacts/kernel-timing.ndjson
          artifacts/kernel-timing/
          artifacts/kernel-timing-debug.log
          artifacts/kernel-timing-debug.ndjson
        if-no-files-found: ignore
        retention-days: 7

    - name: Publish performance trends to gh-pages
      if: >-
        success() && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
         github.event_name == 'workflow_dispatch')
      uses: ./hsa-snoop/.github/actions/publish-perf
      with:
        prometheus-file: ./artifacts/prometheus.txt
        dispatch-log: ./artifacts/kernel-timing.ndjson
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Fail if the kernel timing capture failed
      if: steps.kernel-timing.outcome == 'failure'
      run: |
        echo "::error::kernel timing capture failed; see the 'Capture kernel timing in VM' step"
        exit 1

    # Tear down before the upload: the action's own teardown runs after every
    # step, too late for one. It collects each container's log and the end of
    # the guest's dmesg.
    - name: Tear down the fleet
      id: down
      if: always() && steps.fleet.outputs.stack-dir != ''
      uses: sbates130272/qemu-tool-action@v2
      with:
        operation: down

    - name: Upload fleet logs
      if: failure() && steps.down.outputs.logs-dir != ''
      uses: actions/upload-artifact@v7
      with:
        name: fleet-logs
        path: ${{ steps.down.outputs.logs-dir }}
        if-no-files-found: ignore
        retention-days: 7
